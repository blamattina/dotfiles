onboarding = false

[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[keys]
prefix = "ctrl+space"

[ui]
mouse_capture = true
confirm_close = true
agent_panel_scope = "all"

[ui.sound]
enabled = false

[experimental]
pane_history = false
